<title>혜화 영어 대화방</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one centered chat column; sticky header with level/scenario, scrolling thread, docked composer, vocabulary list below */
:root{
  --bg:#f5f7f7; --surface:#ffffff; --ink:#15211f; --muted:#5d6e6a; --line:#dbe3e1;
  --accent:#0d7a6b; --accent-ink:#ffffff; --accent-soft:#dff1ee;
  --me:#e9eef6; --warn:#a05a00; --warn-soft:#fdf0dc;
  --font:'Inter','Noto Sans KR',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1716; --surface:#172220; --ink:#e6efed; --muted:#94a8a3; --line:#27373a;
  --accent:#3fc2ae; --accent-ink:#06211c; --accent-soft:#16332f;
  --me:#1d2a3a; --warn:#f0b35c; --warn-soft:#33281a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1716; --surface:#172220; --ink:#e6efed; --muted:#94a8a3; --line:#27373a;
  --accent:#3fc2ae; --accent-ink:#06211c; --accent-soft:#16332f;
  --me:#1d2a3a; --warn:#f0b35c; --warn-soft:#33281a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px;padding-block:16px 40px}
header{display:flex;flex-direction:column;gap:12px}
h1{font-size:1.35rem;margin:0;font-weight:700;text-wrap:balance}
.sub{color:var(--muted);font-size:.9rem;margin:2px 0 0}
.controls{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;color:var(--muted);padding:7px 12px;font:inherit;font-size:.88rem;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
select,textarea,button{font:inherit;color:inherit}
select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:.88rem;max-width:100%}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.toggle{display:flex;align-items:center;gap:6px;font-size:.88rem;color:var(--muted)}
#thread{display:flex;flex-direction:column;gap:14px;min-height:280px}
.msg{display:flex;flex-direction:column;gap:6px;max-width:88%;min-width:0}
.msg.tutor{align-self:flex-start}
.msg.me{align-self:flex-end;align-items:flex-end}
.bubble{padding:10px 14px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.tutor .bubble{background:var(--surface);border:1px solid var(--line);border-top-left-radius:4px}
.me .bubble{background:var(--me);border-top-right-radius:4px}
.who{font-size:.75rem;color:var(--muted);letter-spacing:.03em}
.fix{background:var(--warn-soft);color:var(--ink);border-left:3px solid var(--warn);padding:8px 12px;border-radius:6px;font-size:.88rem;white-space:pre-wrap;overflow-wrap:anywhere}
.fix b{color:var(--warn)}
.ok{font-size:.8rem;color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.84rem;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.chip.word{background:var(--accent-soft);border-color:transparent}
.mini{border:0;background:transparent;color:var(--accent);font-size:.82rem;cursor:pointer;padding:2px 0;text-align:left}
.composer{display:flex;gap:8px;align-items:flex-end;position:sticky;bottom:0;background:var(--bg);padding-block:8px calc(8px + env(safe-area-inset-bottom,0px))}
textarea{flex:1;min-width:0;resize:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;max-height:140px}
.btn{border:0;border-radius:12px;padding:10px 16px;background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn.rec{background:var(--warn);color:var(--bg)}
.notice{background:var(--warn-soft);border-radius:8px;padding:10px 14px;font-size:.9rem}
section.vocab{border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:8px}
section.vocab h2{font-size:1rem;margin:0}
.vl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.vl li{display:flex;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-width:0}
.vl span{overflow-wrap:anywhere;min-width:0}
.dots::after{content:'';animation:d 1.2s steps(4,end) infinite}
@keyframes d{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
@media (prefers-reduced-motion:reduce){.dots::after{animation:none;content:'...'}}
.vh{display:flex;justify-content:space-between;align-items:center;gap:12px}
.quiz{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.quiz .q{font-size:1.2rem;font-weight:600;overflow-wrap:anywhere;text-wrap:balance}
.quiz .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:.85rem}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 14px;cursor:pointer;overflow-wrap:anywhere}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.good{background:var(--accent-soft);border-color:var(--accent)}
.opt.bad{background:var(--warn-soft);border-color:var(--warn)}
.opt:disabled{cursor:default}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.score{font-size:1.6rem;font-weight:700}
.pin{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font:inherit;color:inherit}
.w.ok{color:var(--accent)}
.w.bad{color:var(--warn);text-decoration:underline wavy;text-underline-offset:4px}
.heard{min-height:1.5em;color:var(--muted);overflow-wrap:anywhere}
.small{font-size:.8rem;color:var(--muted)}
.focus{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.focus .chip{cursor:default}
.focus .tiles,.focus .vl{width:100%}
.chip.got{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.pl li{flex-wrap:wrap;align-items:center}
.pl .acts{display:flex;gap:12px;flex-wrap:wrap}
.pl .en{font-weight:600}
.rpchip{border-radius:12px;text-align:left}
.polbox{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.polbox details{border-top:1px solid var(--line);padding-top:6px}
.polbox summary{cursor:pointer;font-weight:600;padding:4px 0}
.polbox summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.tile{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile b{font-size:1.4rem;font-variant-numeric:tabular-nums}
.bars{display:flex;align-items:flex-end;gap:8px;height:110px}
.bars>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;min-width:0}
.bars i{display:block;width:100%;max-width:36px;background:var(--accent);border-radius:4px 4px 0 0}
.bars i.zero{background:var(--line)}
.bars span{font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>혜화와 영어 한마디</h1>
      <p class="sub">틀려도 괜찮아요. 한 문장씩 말하면 혜화가 자연스럽게 답하고, 고칠 부분만 한국어로 짚어 드려요.</p>
    </div>
    <div class="controls">
      <div class="seg" id="levels" role="group" aria-label="수준"></div>
      <select id="scenario" aria-label="대화 주제"></select>
      <label class="toggle"><input type="checkbox" id="speakToggle"> 답변 읽어주기</label>
    </div>
  </header>

  <div id="notice" class="notice" hidden></div>
  <div class="focus" id="pc" hidden></div>
  <div class="focus" id="rp" hidden></div>
  <div class="focus" id="focus" hidden></div>
  <div id="thread" aria-live="polite"></div>
  <div class="row" id="starters"></div>

  <div class="composer">
    <button class="btn ghost" id="mic" hidden aria-label="음성으로 입력">말하기</button>
    <textarea id="input" rows="1" placeholder="영어로 한 문장 써 보세요 (막히면 한국어도 괜찮아요)"></textarea>
    <button class="btn" id="send">보내기</button>
  </div>

  <section class="vocab">
    <div class="vh"><h2>내 단어장</h2><div class="row"><button class="btn ghost" id="quizStart" type="button">복습 퀴즈</button><button class="btn ghost" id="pronStart" type="button">발음 연습</button><button class="btn ghost" id="focusStart" type="button">단어로 대화</button><button class="btn ghost" id="logStart" type="button">연습 기록</button><button class="btn ghost" id="dailyStart" type="button">오늘의 표현</button><button class="btn ghost" id="phrasesStart" type="button">생활 표현집</button></div></div>
    <ul class="vl" id="vocab"></ul>
    <div class="quiz" id="quiz" hidden></div>
    <div class="quiz" id="pron" hidden></div>
    <div class="quiz" id="log" hidden></div>
    <div class="quiz" id="daily" hidden></div>
    <div class="quiz" id="phrases" hidden></div>
    <div class="row"><button class="mini" id="resetChat">대화 새로 시작</button></div>
  </section>
</div>

<script>
(function(){
  const LEVELS=[['beginner','입문'],['intermediate','중급'],['advanced','상급']];
  const SCENARIOS=[
    ['free','자유 대화'],
    ['daily','일상 이야기'],
    ['travel','여행·공항·호텔'],
    ['work','직장·회의'],
    ['policy','정책·행정 토론'],
    ['economy','경제·투자 뉴스'],
    ['interview','영어 인터뷰 연습']
  ];
  const STARTERS=[
    'Hi! Can we just chat?',
    'I want to practice talking about my job.',
    'Help me introduce Seocho-gu to a foreign visitor.',
    'What do you think about the economy these days?'
  ];
  const OPENING='Hi, I\'m Hyehwa! I\'m glad you\'re here. How was your day so far?';

  const $=id=>document.getElementById(id);
  const store={
    get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
    set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
  };
  let level=store.get('hw.level','beginner');
  let scenario=store.get('hw.scenario','free');
  let speakOn=store.get('hw.speak',false);
  let vocab=store.get('hw.vocab',[]);
  let msgs=store.get('hw.msgs',null)||[{role:'tutor',text:OPENING}];
  let busy=false, sample=null, tts=null, dict=null, abort=null, dictMode='chat';

  function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}

  function renderControls(){
    const seg=$('levels');seg.textContent='';
    LEVELS.forEach(([k,label])=>{
      const b=el('button',null,label);b.setAttribute('aria-pressed',String(k===level));
      b.onclick=()=>{level=k;store.set('hw.level',k);renderControls()};
      seg.appendChild(b);
    });
    const s=$('scenario');s.textContent='';
    SCENARIOS.forEach(([k,label])=>{const o=el('option',null,label);o.value=k;if(k===scenario)o.selected=true;s.appendChild(o)});
    $('speakToggle').checked=speakOn;
    $('speakToggle').parentElement.hidden=!tts;
  }
  $('scenario').onchange=e=>{scenario=e.target.value;store.set('hw.scenario',scenario)};
  $('speakToggle').onchange=e=>{speakOn=e.target.checked;store.set('hw.speak',speakOn);if(!speakOn&&tts)tts.stop()};

  function renderThread(){
    const t=$('thread');t.textContent='';
    msgs.forEach((m,i)=>{
      const box=el('div','msg '+(m.role==='me'?'me':'tutor'));
      box.appendChild(el('div','who',m.role==='me'?'나':'혜화'));
      const b=el('div','bubble',m.text);
      if(m.pending&&!m.text){b.appendChild(el('span','dots'))}
      box.appendChild(b);
      if(m.role==='tutor'&&m.text&&tts&&!m.pending){
        const sp=el('button','mini','듣기');
        sp.onclick=()=>speak(m.text);box.appendChild(sp);
      }
      if(m.role==='me'&&m.fix!=null){
        if(m.fix==='OK'){box.appendChild(el('div','ok','자연스러워요'))}
        else{const f=el('div','fix');f.appendChild(el('b',null,'이렇게 말하면 더 자연스러워요\n'));f.appendChild(document.createTextNode(m.fix));box.appendChild(f)}
      }
      if(m.role==='tutor'&&m.words&&m.words.length&&!m.pending){
        const r=el('div','row');
        m.words.forEach(w=>{
          const c=el('button','chip word','+ '+w);
          c.title='단어장에 담기';
          c.onclick=()=>addWord(w);
          r.appendChild(c);
        });
        box.appendChild(r);
      }
      t.appendChild(box);
    });
    $('starters').hidden=msgs.length>1;
    window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
  }

  function renderStarters(){
    const r=$('starters');r.textContent='';
    STARTERS.forEach(s=>{const c=el('button','chip',s);c.onclick=()=>{$('input').value=s;$('input').focus()};r.appendChild(c)});
  }

  function renderVocab(){
    const ul=$('vocab');ul.textContent='';
    if(!vocab.length){ul.appendChild(el('li',null,'혜화가 알려 주는 단어를 누르면 여기에 모여요.'));return}
    vocab.forEach((w,i)=>{
      const li=el('li');li.appendChild(el('span',null,w));
      const x=el('button','mini','삭제');x.onclick=()=>{vocab.splice(i,1);store.set('hw.vocab',vocab);renderVocab()};
      li.appendChild(x);ul.appendChild(li);
    });
  }
  function addWord(w){if(!vocab.includes(w)){vocab.unshift(w);store.set('hw.vocab',vocab);renderVocab()}}

  function speak(text){
    if(!tts)return;
    tts.speak(text,{language:'en'}).catch(()=>{});
  }

  function levelGuide(){
    return {
      beginner:'The learner is a beginner. Use very simple words and short sentences (under 12 words). Be warm and patient.',
      intermediate:'The learner is intermediate. Use natural everyday English with a few useful phrasal verbs or idioms.',
      advanced:'The learner is advanced. Use natural, nuanced English at native speed and occasionally challenge them with sophisticated vocabulary.'
    }[level];
  }
  function scenarioGuide(){
    return {
      free:'Free conversation. Follow the learner\'s interests.',
      daily:'Everyday small talk (food, weekend, family, hobbies).',
      travel:'Travel situations: airport, hotel, restaurant, directions. Play the other party when helpful.',
      work:'Workplace English: meetings, emails, presentations, negotiation.',
      policy:'Discussing local government and public policy in English (e.g., welfare, urban planning, resident services, digital transformation of public administration). The learner works for a district office in Seoul. Help them explain policies to foreign audiences.',
      economy:'Discussing international economics, markets and investing news in English, with clear explanations of terms.',
      interview:'Act as an interviewer in an English interview and ask follow-up questions.'
    }[scenario];
  }

  function buildPrompt(){
    const hist=msgs.filter(m=>!m.pending||m.text).slice(-14).map(m=>(m.role==='me'?'Learner: ':'Hyehwa: ')+m.text).join('\n');
    return `You are "Hyehwa", a friendly English conversation partner and tutor for a Korean adult learner.
${levelGuide()}
Topic: ${scenarioGuide()}${focusGuide()}${rpGuide()}

Rules:
- Reply in English as a real conversation partner: react to what they said, then keep it going with ONE question. Keep it to 1-3 short sentences.
- If the learner wrote Korean or mixed Korean, gently give the English version in the FIX section and still continue the conversation in English.
- Correct only genuine mistakes or clearly unnatural phrasing in the learner's LAST message. Write corrections in Korean, short: show the better sentence in English, then a one-line Korean reason. If their sentence is fine, write exactly OK.
- Offer 1-2 useful words or phrases from the conversation, each as "english phrase = 한국어 뜻".
- Never add anything outside the three sections below.

Output format, exactly:
[REPLY]
(your English reply)
[FIX]
(OK or the correction in Korean)
[WORDS]
(one "phrase = 뜻" per line, 0-2 lines)

Conversation so far:
${hist}

Now respond to the learner's last message.`;
  }

  function parse(raw){
    const out={reply:'',fix:null,words:[]};
    const re=/\[(REPLY|FIX|WORDS)\]/g;let m,marks=[];
    while((m=re.exec(raw)))marks.push({k:m[1],s:m.index,e:re.lastIndex});
    if(!marks.length){out.reply=raw.trim();return out}
    marks.forEach((mk,i)=>{
      const body=raw.slice(mk.e,i+1<marks.length?marks[i+1].s:raw.length).trim();
      if(mk.k==='REPLY')out.reply=body;
      if(mk.k==='FIX')out.fix=body;
      if(mk.k==='WORDS')out.words=body.split('\n').map(s=>s.replace(/^[-*•\s]+/,'').trim()).filter(Boolean).slice(0,2);
    });
    return out;
  }

  function persist(){store.set('hw.msgs',msgs.filter(m=>!m.pending).slice(-40))}

  async function send(){
    const input=$('input');const text=input.value.trim();
    if(!text||busy)return;
    if(pc){pcAnswer(text);return}
    if(!sample){showNotice('이 화면에서는 Claude 연결을 쓸 수 없어요. claude.ai에서 열어 주세요.');return}
    if(dict)try{dict.stop()}catch(e){}
    input.value='';autoGrow();
    busy=true;$('send').disabled=true;
    markFocus(text);
    markRp(text);
    const mine={role:'me',text,fix:null};
    const tut={role:'tutor',text:'',pending:true,words:[]};
    msgs.push(mine,tut);renderThread();
    abort=new AbortController();
    try{
      const prompt=buildPrompt();
      const res=await sample(prompt,{
        cache:false,signal:abort.signal,modelTier:'quick',
        onText:({text:t})=>{const p=parse(t);tut.text=p.reply;renderThread()}
      });
      const p=parse(res.text);
      tut.text=p.reply||res.text.trim();tut.words=p.words;tut.pending=false;
      if(p.fix!=null){mine.fix=p.fix}
      logEv('chat',{said:text.slice(0,120),fix:(p.fix&&p.fix!=='OK')?p.fix.slice(0,240):''});
      hideNotice();
      renderThread();persist();
      if(speakOn)speak(tut.text);
    }catch(err){
      msgs.pop();
      if(!tut.text){input.value=text;msgs.pop()} else {tut.pending=false;persist()}
      const c=err&&err.code;
      showNotice(c==='not_granted'?'Claude 연결을 허용해야 대화할 수 있어요. 다시 보내면 허용 창이 떠요.'
        :c==='rate_limited'?'잠깐 너무 빨랐어요. 조금 뒤에 다시 보내 주세요.'
        :'답변을 가져오지 못했어요. 다시 한 번 보내 주세요.');
      renderThread();
    }finally{busy=false;$('send').disabled=false;abort=null}
  }

  function showNotice(t){const n=$('notice');n.textContent=t;n.hidden=false}
  function hideNotice(){$('notice').hidden=true}

  function autoGrow(){const i=$('input');i.style.height='auto';i.style.height=Math.min(i.scrollHeight,140)+'px'}
  $('input').addEventListener('input',autoGrow);
  $('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}});
  $('send').onclick=send;
  $('resetChat').onclick=()=>{if(abort)abort.abort();msgs=[{role:'tutor',text:OPENING}];persist();hideNotice();renderThread()};

  function setupDictation(){
    if(!dict)return;
    const mic=$('mic');mic.hidden=false;
    let base='';
    dict.onState(({state})=>{if(dictMode!=='chat')return;mic.classList.toggle('rec',state==='listening');mic.textContent=state==='listening'?'듣는 중':'말하기'});
    dict.onPartial(({text})=>{if(dictMode!=='chat')return;$('input').value=(base+' '+text).trim();autoGrow()});
    dict.onFinal(({text})=>{if(dictMode!=='chat')return;base=($('input').value.trim()===base?base:$('input').value.trim());base=(base+' '+text).trim();$('input').value=base;autoGrow()});
    mic.onclick=()=>{
      if(mic.classList.contains('rec')){dict.stop();return}
      dictMode='chat';base=$('input').value.trim();
      dict.start().catch(()=>{});
    };
  }

  /* ---- 복습 퀴즈 ---- */
  const stats=store.get('hw.stats',{});
  let quizDir=store.get('hw.quizDir','en2ko'), Q=null;
  function pairs(){

  function candidates(){

    msgs.filter(m=>m.role==='tutor'&&m.text).slice(-3).reverse().forEach(m=>{

  function compare(target,heard){
    const tokens=target.replace(/[-–—]/g,' ').split(' ').filter(Boolean);
    const tn=tokens.map(x=>norm(x).join(' '));
    const h=norm(heard);
    const n=tn.length,m=h.length;
    const dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
    for(let i=1;i<=n;i++)for(let j=1;j<=m;j++)
      dp[i][j]=(tn[i-1]&&tn[i-1]===h[j-1])?dp[i-1][j-1]+1:Math.max(dp[i-1][j],dp[i][j-1]);
    const ok=new Array(n).fill(false);
    let i=n,j=m;
    while(i>0&&j>0){
      if(tn[i-1]&&tn[i-1]===h[j-1]){ok[i-1]=true;i--;j--}
      else if(dp[i-1][j]>=dp[i][j-1])i--;else j--;
    }
    const scored=tn.filter(Boolean).length||1;
    const hit=ok.filter((v,k)=>v&&tn[k]).length;
    tn.forEach((t,k)=>{if(!t)ok[k]=true});
    return {tokens,ok,pct:Math.round(100*hit/scored)};
  }

  async function pcEvaluate(s){
    pcRes={loading:true};renderPc();
    const pairs=s.qs.map((q,i)=>'Q'+(i+1)+': '+q+'\nA'+(i+1)+': '+(s.answers[i]||'(no answer)')).join('\n\n');
    const prompt=`You are an English coach for a Korean local-government official who just practiced a mock press conference with a foreign journalist about the policy named ${s.name}. Below are the journalist's questions and the official's answers.\n\n${pairs}\n\nEvaluate the answers for a non-native speaker in a formal public setting. Return only a JSON object with these fields: scores (an object with integer fields clarity, naturalness and diplomacy, each from 1 to 5), summary (two short sentences in Korean), strengths (an array of 2 short Korean strings), improvements (an array of 2 or 3 short Korean strings), items (an array with one object per question, each with q as the question number, better as an improved English answer that keeps the speaker's own facts and never invents figures or details, and tip as one short Korean tip).`;
    try{
      const r=await sample.json(prompt,{cache:false});
      if(!r||typeof r!=='object'||!r.scores)throw new Error('bad');
      pcRes={data:r};
      const sc=r.scores;const avg=Math.round(((+sc.clarity||0)+(+sc.naturalness||0)+(+sc.diplomacy||0))/3*10)/10;
      logEv('pc',{s:avg});

    if(pcRes.error){

    box.appendChild(tiles);
    if(typeof d.summary==='string')box.appendChild(el('div',null,d.summary));
    const lists=[['잘한 점',d.strengths],['고칠 점',d.improvements]];
    lists.forEach(a=>{
      if(!Array.isArray(a[1])||!a[1].length)return;
      box.appendChild(el('div','small',a[0]));
      const ul=el('ul','vl');
      a[1].slice(0,4).forEach(t=>{const li=el('li');li.appendChild(el('span',null,String(t)));ul.appendChild(li)});
      box.appendChild(ul);
    });
    box.appendChild(el('div','small','질문별 답변과 개선 예시'));
    const ul=el('ul','vl');
    pcLast.qs.forEach((q,i)=>{
      const it=(Array.isArray(d.items)?d.items:[]).find(x=>Number(x.q)===i+1)||{};
      const li=el('li');const sp=el('span');
      sp.appendChild(el('span','small','Q'+(i+1)+'. '+q));sp.appendChild(el('br'));
      sp.appendChild(el('span','small','내 답변: '+(pcLast.answers[i]||'-')));
      if(typeof it.better==='string'){sp.appendChild(el('br'));sp.appendChild(el('span','en',it.better))}
      if(typeof it.tip==='string'){sp.appendChild(el('br'));sp.appendChild(el('span','small',it.tip))}
      li.appendChild(sp);
      if(tts&&typeof it.better==='string'){const l=el('button','mini','듣기');l.onclick=()=>say(it.better,1);li.appendChild(l)}
      ul.appendChild(li);
    });
    box.appendChild(ul);
    const row=el('div','row');
    const again=el('button','btn','다시 하기');again.onclick=startPc;
    row.appendChild(again);row.appendChild(close);box.appendChild(row);
  }

  renderControls();renderStarters();renderThread();renderVocab();renderFocus();renderRp();renderPc();

  if(window.claude&&window.claude.use){
    window.claude.use('sample').then(s=>{
      sample=s;
      if(!s)showNotice('이 화면에서는 Claude 연결을 쓸 수 없어요. claude.ai에서 열어 주세요.');
    }).catch(()=>{});
    window.claude.use('tts').then(t=>{tts=t;renderControls();renderThread()}).catch(()=>{});
    window.claude.use('dictation').then(d=>{dict=d;setupDictation()}).catch(()=>{});
  } else {
    showNotice('이 화면에서는 Claude 연결을 쓸 수 없어요. claude.ai에서 열어 주세요.');
  }
})();
</script>
